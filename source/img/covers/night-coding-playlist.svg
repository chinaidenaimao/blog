      <stop offset="0%" stop-color="#06131f"/>
      <stop offset="100%" stop-color="#30cfd0"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#c7fff9" stop-opacity="0.95"/>

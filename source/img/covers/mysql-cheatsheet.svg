  <path d="-40,800 0,525 171,595 343,568 514,550 686,525 857,582 1029,569 1200,569 1200,800" fill="#120b2e" opacity="0.55"/>
  <path d="-40,800 0,684 171,624 343,634 514,666 686,667 857,662 1029,545 1200,673 1200,800" fill="#120b2e" opacity="0.9"/>


  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="488" cy="275" r="288" fill="url(#sunGlow)"/>
  <circle cx="488" cy="275" r="90" fill="#fff7d6" opacity="0.92"/>
  
  <path d="-40,800 0,506 171,573 343,521 514,516 686,488 857,554 1029,599 1200,494 1200,800" fill="#3a1c2b" opacity="0.55"/>
  <path d="-40,800 0,654 171,549 343,565 514,566 686,536 857,474 1029,654 1200,627 1200,800" fill="#3a1c2b" opacity="0.9"/>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.06"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#3a1c2b"/>
      <stop offset="100%" stop-color="#f6d365"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fff7d6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
